{% extends 'base.html' %}

{% block title %}
Adicionar Consulta
{% endblock %}

{% block body %}

<head>

<body>
<style>
    body {
        place-items: center;

    }
    form {
        width: 30%;
        line-height: 150%;
        transform: translateY(100px);
        border: 2px solid#000000;
        border-radius: 4px;
        padding: 12px 20px;
        background-color: white;
    }
</style>
</head>

<form action = "" method = "POST">
    {% csrf_token %}
    <label style ="font-weight: bold">Consultas</label> 
    <br>
    <label style="font-weight: lighter;font-size: 12px;">Insira as Informações da consulta</label>
    <br>
    <br>
    <label>Tipo</label>
    <br>
    {{ form.tipo }}
    <br>
    <br>
    <label>Horario</label>
    <br>
    {{ form.horario }}
    <br>
    <br>
    <label>Data</label>
    <br>
    {{ form.data }}
    <br>
    <br>
    <label>Sala</label>
    <br>
    {{ form.sala }}
    <br>
    <br>
    <label>Paciente</label>
    <br>
    {{ form.paciente }}
    <br>
    <br>
    <label>Profissional de saude</label>
    <br>
    {{ form.profissional_saude }}
    <br>
    <br>
    <button type="submit">Enviar</button>

</form>
</body>

{% endblock %}
