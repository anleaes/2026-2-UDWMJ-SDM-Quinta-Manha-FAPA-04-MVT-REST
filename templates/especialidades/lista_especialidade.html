{% extends 'base.html' %}

{% block title %}
Lista
{% endblock %}

{% block body %}

<head>
 <style>
    body {
     place-items: center;
   }

   label {
    display: block;
    text-align: center;
    transform: translateY(40px);
    position: relative;
    z-index: 2;
  
   }

   table {
     width: 90%;
     transform: translateY(20px);
     border: 2px solid #000000;
     padding: 20px 1px;
     background-color: white;
     
   }

 </style>
</head>

<body>
<br>
<label>Lista de especialidades</label>    
<table border = "1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Pre Requisitos</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        {% for especialidade in especialidades %}
        <tr>
            <th>{{ especialidade.id }}</th>
            <th>{{ especialidade.tipo }}</th>
            <th>{{ especialidade.prerequisito }}</th>
            <th>{{ especialidade.status }}</th>
        </tr>
        {% endfor %}
    </tbody>

</table>

</body>

{% endblock %}
