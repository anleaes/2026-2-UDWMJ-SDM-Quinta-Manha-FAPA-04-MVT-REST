{% extends 'base.html' %}
{% load static %}

{% block title %}
Lista 
{% endblock %}

{% block body %}

<head>
 <style>
    body {
     place-items: center;
   }

   label {
    display: block;
    text-align: center;
    transform: translateY(40px);
    position: relative;
    z-index: 2;
  
   }

   table {
     width: 90%;
     transform: translateY(20px);
     border: 2px solid #000000;
     padding: 20px 1px;
     background-color: white;
     
   }

 </style>
</head>

<body>
<br>
<label>Lista de salas</label>
<table border = "1">
   <thead>
    <tr>
        <th>ID</th>
        <th>Numero</th>
        <th>Status</th>
        <th>Setor</th>
    </tr>
   </thead>

   <tbody>
    {% for sala in salas %}
    <tr>
      <th>{{ sala.id }}</th>
      <th>{{ sala.numero }}</th>
      <th>{{ sala.status }}</th>
      <th>{{ sala.setor }}</th>
      <th><a href="{% url 'salas:delete_sala' sala.id %}"><img src="{% static 'img/deleta.png' %}" width="30px" height="30px"></a></th>
      <th><a href="{% url 'salas:edit_sala' sala.id %}"><img src="{% static 'img/edit.png' %}" width="30px" height="30px"></a></th>
    </tr>
    {% endfor %}
   </tbody>

</table>

</body>

{% endblock %}
