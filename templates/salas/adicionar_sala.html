{% extends 'base.html' %}

{% block title %}
Adicionar 
{% endblock %}

{% block body %}

<head>
<style>
    body {
        place-items: center;

    }
    form {
        width: 30%;
        line-height: 150%;
        transform: translateY(100px);
        border: 2px solid#000000;
        border-radius: 4px;
        padding: 12px 20px;
        background-color: white;
    }
</style>
</head>

<body>

<form action = "" method = "POST">
    {% csrf_token %}

    <label style ="font-weight: bold">Salas</label> 
    <br>
    <label style="font-weight: lighter;font-size: 12px;">Insira as Informações da sala</label>
    <br>
    <br>
    <label>Numero</label>
    <br>
    {{ form.numero }}
    <br>
    <br>
    <label>Status</label>
    <br>
    {{ form.status }}
    <br>
    <br>
    <label>Setor</label>
    <br>
    {{ form.setor }}
    <br>
    <br>
    <br>
    <button type="submit">Enviar</button>

</form>

</body>


{% endblock %}
