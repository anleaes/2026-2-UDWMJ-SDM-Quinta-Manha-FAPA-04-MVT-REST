{% extends 'base.html' %}

{% block title %}
Lista de diagnostico 
{% endblock %}

{% block body %}
<head>
 <style>
    body {
     place-items: center;
   }

   label {
    display: block;
    text-align: center;
    transform: translateY(40px);
    position: relative;
    z-index: 2;
  
   }

   table {
     width: 90%;
     transform: translateY(20px);
     border: 2px solid #000000;
     padding: 20px 1px;
     background-color: white;
     
   }

 </style>
</head>

<body>
<br>
<label>Lista de diagnosticos</label>    
<table border = "1">
 <thead>
  <tr>
    <th>Id</th>
    <th>Descrição</th>
    <th>Data</th>
  </tr>
 </thead>

 <tbody>
  {% for diagnostico in diagnosticos %}
  <tr>
    <th>{{ diagnostico.id }}</th>
    <th>{{ diagnostico.descricao }}</th>
    <th>{{ diagnostico.data }}</th>
  </tr>
  {% endfor %}

 </tbody>

</table>

</body>

{% endblock %}
