{% extends 'base.html' %}

{% block title %}
Lista 
{% endblock %}

{% block body %}
<head>
 <style>
    body {
     place-items: center;
   }

   label {
    display: block;
    text-align: center;
    transform: translateY(40px);
    position: relative;
    z-index: 2;
  
   }

   table {
     width: 90%;
     transform: translateY(20px);
     border: 2px solid #000000;
     padding: 20px 1px;
     background-color: white;
     
   }

 </style>
</head>

<body>
  <br>
  <label>Lista de agendamentos</label>
<table border = "1">
  
   <thead>
   
    <tr>
        <th>ID</th>
        <th>Chamado</th>
        <th>Horario</th>
        <th>data</th>
    </tr>
   </thead>

   <tbody>
    {% for agendamento in agendamentos %}
    <tr>
      <th>{{ agendamento.id }}</th>
      <th>{{ agendamento.chamado }}</th>
      <th>{{ agendamento.horario }}</th>
      <th>{{ agendamento.data }}</th>
    </tr>
    {% endfor %}
   </tbody>

</table>
</body>

{% endblock %}
