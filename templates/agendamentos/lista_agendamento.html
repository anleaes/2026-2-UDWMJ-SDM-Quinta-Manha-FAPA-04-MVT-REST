{% extends 'base.html' %}

{% block title %}
Lista 
{% endblock %}

{% block body %}

<table border = "1">
   <thead>
    <tr>
        <th>ID</th>
        <th>Chamado</th>
        <th>Horario</th>
        <th>data</th>
    </tr>
   </thead>

   <tbody>
    {% for agendamento in agendamentos %}
    <tr>
      <th>{{ agendamento.id }}</th>
      <th>{{ agendamento.chamado }}</th>
      <th>{{ agendamento.horario }}</th>
      <th>{{ agendamento.data }}</th>
    </tr>
    {% endfor %}
   </tbody>

</table>

{% endblock %}
