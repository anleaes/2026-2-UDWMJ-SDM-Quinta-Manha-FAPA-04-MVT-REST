{% extends 'base.html' %}

{% block title %}
Adicionar 
{% endblock %}

{% block body %}

<head>
<style>
    body {
        place-items: center;

    }
    form {
        width: 30%;
        line-height: 150%;
        transform: translateY(100px);
        border: 2px solid#000000;
        border-radius: 4px;
        padding: 12px 20px;
        background-color: white;
    }
</style>
</head>
    
<body>
<form action = "" method = "POST">
    {% csrf_token %}

    
    <label style ="font-weight: bold">Agendamentos</label> 
    <br>
    <label style="font-weight: lighter;font-size: 12px;">Insira as Informações do agendamento</label>
    <br>
    <br>
    <label>Chamado</label>
    <br>
    {{ form.chamado }}
    <br>
    <br>
    <label>Horario</label>
    <br>
    {{ form.horario }}
    <br>
    <br>
    <label>Data</label>
    <br>
    {{ form.data }}
    <br>
    <br>
    <label>Profissional de saude</label>
    <br>
    {{ form.profissional_saude}}
    <br>
    <br>
    <label>Paciente</label>
    <br>
    {{ form.paciente }}
    <br>
    <br>
    <label>Recepcionista</label>
    <br>
    {{ form.recepcionista }}
    <br>
    <br>
    <br>
    <button type="submit">Enviar</button>

</form>
</body>

{% endblock %}
