{% extends 'base.html' %}

{% block title %}
Adicionar Exame
{% endblock %}

{% block body %}

<form action = "" method = "POST">
    {% csrf_token %}

    <label>Tipo</label>
    {{ form.tipo }}
    <br>
    <label>Status</label>
    {{ form.status }}
    <br>
    <label>Data</label>
    {{ form.data }}
    <br>
    <label>Observações</label>
    {{ form.obs }}
    <br>
    <label>Laudo</label>
    {{ form.laudo }}
    <br>
    <button type="submit">Enviar</button>

</form>

{% endblock %}
