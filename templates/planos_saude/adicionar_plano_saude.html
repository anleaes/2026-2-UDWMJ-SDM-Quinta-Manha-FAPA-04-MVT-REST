{% extends 'base.html' %}

{% block title %}
Adicionar Plano de Saude
{% endblock %}

{% block body %}


<form action = "" method = "POST">
    {% csrf_token %}

    <label>Nome do Plano</label>
    {{ form.nome }}
    <br>
    <label>Numero de identificação</label>
    {{ form.numero }}
    <br>
    <label>Validade</label>
    {{ form.validade }}
    <br>
    <button type="submit">Enviar</button>

</form>


{% endblock %}
