{% extends 'base.html' %}

{% block title %}
Adicionar Profissional de Saude
{% endblock %}

{% block body %}

<form action = "" method = "POST">
    {% csrf_token %}

    <label>Nome</label>
    {{ form.nome }}
    <br>
    <label>CPF</label>
    {{ form.cpf }}
    <br>
    <label>Telefone</label>
    {{ form.telefone }}
    <br>
    <label>Data de Nascimento</label>
    {{ form.data }}
    <br>
    <button type="submit">Enviar</button>

</form>

{% endblock %}
