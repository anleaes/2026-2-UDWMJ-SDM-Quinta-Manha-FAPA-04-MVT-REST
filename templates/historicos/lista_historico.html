{% extends 'base.html' %}

{% block title %}
Lista de Historico
{% endblock %}

{% block body %}

<head>
 <style>
    body {
     place-items: center;
   }

   label {
    display: block;
    text-align: center;
    transform: translateY(40px);
    position: relative;
    z-index: 2;
  
   }

   table {
     width: 90%;
     transform: translateY(20px);
     border: 2px solid #000000;
     padding: 20px 1px;
     background-color: white;
     
   }

 </style>
</head>

<body>
<br>
<label>Lista de historico</label>    
<table border = "1">
<thead>
  <tr>
    <th>ID</th>
    <th>Evolucao</th>
    <th>Tipo</th>
    <th>Risco</th>
  </tr>
</thead>

<tbody>
{% for historico in historicos %}
<tr>
    <th>{{ historico.id }}</th>
    <th>{{ historico.evolucao }}</th>
    <th>{{ historico.tipo }}</th>
    <th>{{ historico.risco }}</th>
</tr>
{% endfor %}
</tbody>

</table>

</body>

{% endblock %}
