{% extends 'base.html' %}

{% block title %}
Lista de Historico
{% endblock %}

{% block body %}

<b>Lista</b>
<table border = "1">
<thead>
  <tr>
    <th>ID</th>
    <th>Evolucao</th>
    <th>Tipo</th>
    <th>Risco</th>
  </tr>
</thead>

<tbody>
{% for historico in historicos %}
<tr>
    <th>{{ historico.id }}</th>
    <th>{{ historico.evolucao }}</th>
    <th>{{ historico.tipo }}</th>
    <th>{{ historico.risco }}</th>
</tr>
{% endfor %}
</tbody>

</table>

{% endblock %}
