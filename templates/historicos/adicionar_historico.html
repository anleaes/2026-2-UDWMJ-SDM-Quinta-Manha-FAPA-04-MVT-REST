{% extends 'base.html' %}

{% block title %}

Adicionar Historico - {{ block.super }}

{% endblock %}

{% block body %}
<head>
<style>
    body {
        place-items: center;

    }
    form {
        width: 30%;
        line-height: 150%;
        transform: translateY(100px);
        border: 2px solid#000000;
        border-radius: 4px;
        padding: 12px 20px;
        background-color: white;
    }
</style>
</head>

<body>
<form action = "" method = "POST">
    {% csrf_token %}

    <label style ="font-weight: bold">Historico</label> 
    <br>
    <label style="font-weight: lighter;font-size: 12px;">Insira as Informações do historico</label>
    <br>
    <br>
    <label>Evolução</label>
    <br>
    {{ form.evolucao }}
    <br>
    <br>
    <label>Tipo</label>
    <br>
    {{ form.tipo }}
    <br>
    <br>
    <label>Risco</label>
    <br>
    {{ form.risco }}
    <br>
    <br>
    <label>Prontuario</label>
    <br>
    {{ form.prontuario }}
    <br>
    <br>
    <br>
    <button type="submit">Enviar</button>
</form>

</body>

{% endblock %}
